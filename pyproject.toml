[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "personamcp"
version = "0.1.0"
description = "Local-first personal communication memory for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["mcp>=1.26,<2", "typer>=0.16,<1", "platformdirs>=4,<5"]

[project.optional-dependencies]
semantic = ["sentence-transformers>=5,<6"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "mypy>=1.16,<2", "pytest-cov>=6,<8"]

[project.scripts]
persona = "personamcp.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/personamcp"]

[tool.hatch.build.targets.wheel.force-include]
"skills/write-like-me/SKILL.md" = "personamcp/skills/write-like-me/SKILL.md"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "skills", "docs", "README.md", "LICENSE",
           "CONTRIBUTING.md", "SECURITY.md", "CODE_OF_CONDUCT.md", "pyproject.toml", "uv.lock",
           ".github/workflows/ci.yml", ".gitignore"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["sentence_transformers", "sentence_transformers.*"]
ignore_missing_imports = true
follow_imports = "skip"
